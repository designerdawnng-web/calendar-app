<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — Untitled UI</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="app-card">

    <!-- ===== Sidebar ===== -->
    <aside id="sidebar">
      <div id="sidebar-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect width="28" height="28" rx="6" fill="#7C3AED"/>
          <path d="M8 14l4 4 8-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Untitled UI</span>
      </div>

      <nav id="sidebar-nav" aria-label="Main navigation">
        <ul>
          <li class="nav-section-label">Main menu</li>
          <li>
            <a href="#" class="nav-item">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 10.5L10 3l7 7.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1v-6.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              Dashboard
            </a>
          </li>
          <li>
            <a href="#" class="nav-item active" aria-current="page">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 8h14M7 4v2M13 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Calendar
            </a>
          </li>
          <li>
            <a href="#" class="nav-item">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2a6 6 0 016 6c0 3.87-6 10-6 10S4 11.87 4 8a6 6 0 016-6z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
              Projects
              <span class="nav-badge">4</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M17 10H3M17 5H3M17 15H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Tasks
              <span class="nav-badge">12</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M17 13.5A7 7 0 113 13.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Reporting
            </a>
          </li>
          <li>
            <a href="#" class="nav-item">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Users
            </a>
          </li>

          <li class="nav-section-label">Support</li>
          <li>
            <a href="#" class="nav-item">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v5M10 7h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Help center
            </a>
          </li>
          <li>
            <a href="#" class="nav-item">
              <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M4 4h12v10H4zM8 14v2M12 14v2M6 16h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Settings
            </a>
          </li>
        </ul>

        <div id="sidebar-team">
          <p class="nav-section-label">Your teams</p>
          <button class="team-item" type="button">
            <div class="team-avatar" style="background:#7C3AED">U</div>
            <span>Untitled UI</span>
          </button>
          <button class="team-item" type="button">
            <div class="team-avatar" style="background:#0EA5E9">D</div>
            <span>Design team</span>
          </button>
        </div>
      </nav>

      <div id="sidebar-user">
        <div class="user-avatar">OL</div>
        <div class="user-info">
          <p class="user-name">Olivia Rhye</p>
          <p class="user-email">olivia@untitledui.com</p>
        </div>
        <button class="user-logout" aria-label="Log out">
          <svg viewBox="0 0 18 18" fill="none" width="16" height="16"><path d="M12 6l3 3-3 3M15 9H7M9 3H4a1 1 0 00-1 1v10a1 1 0 001 1h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- ===== Main content area ===== -->
    <main id="main-content">

      <!-- Breadcrumb -->
      <nav id="breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li>
            <svg class="breadcrumb-home" viewBox="0 0 16 16" fill="none" width="14" height="14" aria-hidden="true"><path d="M2 8.5L8 2l6 6.5V14a.5.5 0 01-.5.5H3A.5.5 0 012 14V8.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span class="sr-only">Home</span>
          </li>
          <li><span class="breadcrumb-item">Untitled UI</span></li>
          <li><span class="breadcrumb-item active" aria-current="page">Calendar</span></li>
        </ol>
      </nav>

      <!-- Page header -->
      <div id="page-header">
        <h1 id="page-title">Calendar</h1>
        <div id="page-search">
          <svg viewBox="0 0 18 18" fill="none" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M14 14l-2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="search" placeholder="Search" aria-label="Search calendar" />
          <kbd>⌘K</kbd>
        </div>
      </div>

      <!-- Tabs -->
      <div id="tabs-row" role="tablist">
        <button class="tab active" role="tab" aria-selected="true">All events</button>
        <button class="tab" role="tab" aria-selected="false">Shared</button>
        <button class="tab" role="tab" aria-selected="false">Public</button>
        <button class="tab" role="tab" aria-selected="false">Archived</button>
      </div>

      <!-- Calendar panel -->
      <div id="calendar-panel" role="region" aria-label="Calendar">

        <!-- Calendar subheader -->
        <div id="calendar-subheader">
          <div id="cal-subheader-left">
            <span id="month-badge"></span>
            <h2 id="current-month-label"></h2>
            <span id="date-range-label"></span>
            <button id="cal-search-btn" aria-label="Search events">
              <svg viewBox="0 0 18 18" fill="none" width="15" height="15"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M14 14l-2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="cal-subheader-right">
            <button id="prev-month" aria-label="Previous month">&#8592;</button>
            <button id="today-btn">Today</button>
            <button id="next-month" aria-label="Next month">&#8594;</button>
            <button id="view-btn">Month view &#9660;</button>
            <button id="add-event-btn">+ Add event</button>
          </div>
        </div>

        <!-- Weekday labels (Monday-first) -->
        <div id="weekday-labels">
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
          <span>Sun</span>
        </div>

        <!-- Calendar grid -->
        <div id="calendar-grid" role="grid"></div>
      </div>
    </main>
  </div>

  <!-- ===== Add / Edit Event Modal ===== -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal">
      <div id="modal-header">
        <h2 id="modal-title">Add Event</h2>
        <button id="modal-close" aria-label="Close modal">&#10005;</button>
      </div>

      <form id="event-form" novalidate>
        <div class="field-group">
          <label for="event-title">Title <span class="required">*</span></label>
          <input id="event-title" type="text" placeholder="Event title" autocomplete="off" aria-required="true" />
        </div>

        <div class="field-group">
          <label for="event-date">Date</label>
          <input id="event-date" type="date" readonly />
        </div>

        <div class="time-row">
          <div class="field-group">
            <label for="event-start">Start time</label>
            <input id="event-start" type="time" />
          </div>
          <div class="field-group">
            <label for="event-end">End time</label>
            <input id="event-end" type="time" />
          </div>
        </div>

        <div class="field-group">
          <label>Color</label>
          <div id="color-picker" role="group" aria-label="Event color">
            <button type="button" class="color-swatch" data-color="#7C3AED" style="background:#7C3AED" aria-label="Purple" aria-pressed="true"></button>
            <button type="button" class="color-swatch" data-color="#0EA5E9" style="background:#0EA5E9" aria-label="Blue" aria-pressed="false"></button>
            <button type="button" class="color-swatch" data-color="#10B981" style="background:#10B981" aria-label="Green" aria-pressed="false"></button>
            <button type="button" class="color-swatch" data-color="#F59E0B" style="background:#F59E0B" aria-label="Amber" aria-pressed="false"></button>
            <button type="button" class="color-swatch" data-color="#EF4444" style="background:#EF4444" aria-label="Red" aria-pressed="false"></button>
          </div>
        </div>

        <div class="field-group">
          <label for="event-notes">Notes</label>
          <textarea id="event-notes" rows="3" placeholder="Optional notes"></textarea>
        </div>

        <div id="form-errors" role="alert"></div>

        <div id="modal-actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="delete-btn" class="hidden">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
